name: CI

on:
  push:
  pull_request:

# Least privilege: the jobs only need to read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Check source file length
        run: python ../scripts/check_file_length.py
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend tests, type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      - name: Run tests
        run: npm test
      - name: Type check and build
        run: npm run build
      - name: Bundle makes no request to another origin
        run: python ../scripts/check_bundle_offline.py

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: http://127.0.0.1:8082
      API: http://127.0.0.1:8082/api/v1
    steps:
      - uses: actions/checkout@v4
      - name: Build images and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: UI is served with its security headers
        run: |
          curl --fail --silent --show-error "$BASE_URL/" | grep -q "LexStream On-Prem"
          curl --silent --head "$BASE_URL/" | grep -i "^content-security-policy:"
      - name: API answers through the proxy
        run: |
          curl --fail --silent --show-error "$API/health" | grep -q '"status":"ok"'
          curl --fail --silent --show-error "$API/tenants" | grep -q '"tenant_id":"TNT-IND-02"'
      - name: Search stream reaches the client through Nginx without buffering
        run: |
          # The stream is finite, so curl ends by itself; any failure fails the step.
          curl --fail --silent --show-error --no-buffer --max-time 30             "$API/search/stream?tenant_id=TNT-LAW-01" > search.txt
          test "$(grep -c '^event: result' search.txt)" = "10"
          test "$(grep -c '^event: analytics_summary' search.txt)" = "1"
          tail -n 4 search.txt | grep -q '^event: analytics_summary'
      - name: Tenant partitioning holds through the proxy
        run: |
          curl --fail --silent --show-error "$API/search/snapshot?tenant_id=TNT-LAW-01" > law.json
          curl --fail --silent --show-error "$API/search/snapshot?tenant_id=TNT-IND-02" > ind.json
          grep -q '"docket_id":"SYN-LAW-' law.json
          grep -q '"docket_id":"SYN-IND-' ind.json
          if grep -q 'SYN-IND-' law.json || grep -q 'SYN-LAW-' ind.json; then
            echo "a response contains a record of the other tenant"
            exit 1
          fi
          unknown="$(curl --silent -o /dev/null -w '%{http_code}' "$API/search/snapshot?tenant_id=TNT-XXX-09")"
          echo "unknown tenant: HTTP $unknown"
          test "$unknown" = "404"
      - name: Simulated crawl round trip on the state stream
        run: |
          # Exit status 28 is curl's own time limit: the events may all have
          # arrived although the connection closed late, so the captured events decide.
          crawl() {
            curl --silent --show-error -o "$1" -w '%{http_code}' -X POST               -H "Content-Type: application/json" -d "$2" "$API/ingest/simulate-crawl"
          }
          status=0
          curl --fail --silent --show-error --no-buffer --max-time 30             "$API/ingest/stream?tenant_id=TNT-IND-02&max_events=8" > state.txt &
          stream_pid=$!
          sleep 1
          body='{"tenant_id":"TNT-IND-02","source_portal":"KESTREL_ENFORCEMENT_BULLETIN"}'
          test "$(crawl first.json "$body")" = "202"
          grep -q '"run_id":"RUN-IND-0001"' first.json
          test "$(crawl second.json "$body")" = "409"
          test "$(crawl url.json '{"tenant_id":"TNT-IND-02","source_portal":"https://example.org"}')" = "422"
          wait "$stream_pid" || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 28 ]; then
            echo "curl failed with status $status"; cat state.txt; exit 1
          fi
          for stage in CONNECTING_PORTAL PARSING_DOCKETS EXTRACTING_METADATA INDEXED_NEW_RULING; do
            grep -q "\"stage\":\"$stage\"" state.txt || { echo "stage $stage missing"; cat state.txt; exit 1; }
          done
          grep -q '"state":"COMPLETED"' state.txt
          curl --fail --silent --show-error "$API/ingest/state?tenant_id=TNT-LAW-01" | grep -q '"crawled_rulings":0'
      - name: Report download and reset
        run: |
          curl --fail --silent --show-error -o report.xlsx "$API/export/analytics-xlsx?tenant_id=TNT-IND-02"
          test "$(head -c 2 report.xlsx)" = "PK"
          unzip -tq report.xlsx
          curl --fail --silent --show-error -X POST "$API/ingest/reset" | grep -q '"status":"reset"'
          curl --fail --silent --show-error "$API/ingest/state?tenant_id=TNT-IND-02" | grep -q '"crawled_rulings":0'
      - name: Containers do not run as root
        run: |
          # Assigned separately so the step fails if the command itself fails,
          # instead of comparing an empty string against "0".
          backend_uid="$(docker compose exec -T backend id -u)"
          frontend_uid="$(docker compose exec -T frontend id -u)"
          echo "backend uid=$backend_uid, frontend uid=$frontend_uid"
          [[ "$backend_uid" =~ ^[0-9]+$ && "$backend_uid" != "0" ]]
          [[ "$frontend_uid" =~ ^[0-9]+$ && "$frontend_uid" != "0" ]]
      - name: Show container state and logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
